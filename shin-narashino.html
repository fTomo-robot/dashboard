<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新習志野ダッシュボード</title>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    /* 横置きモニター（16:9）スクロールなし全画面フィット ── 約1920×1080想定 */
    :root {
      --bg: #eef0f8;
      --card: #ffffff;
      --card2: #f4f6fb;
      --accent: #2f6de0;
      --accent2: #d93a50;
      --green: #1a8a56;
      --yellow: #b8860b;
      --text: #1a1d2e;
      --muted: #6b7490;
      --border: #dde1ef;
      --shadow: 0 3px 12px rgba(30,40,80,0.09);
      /* 京葉線: 赤 */
      --keiyo: #cf1515;
      --keiyo-light: #ffe8e8;
      --keiyo-text: #8a1010;
      --keiyo-border: #e8a8a8;
      /* 武蔵野線: オレンジ（府中本町行） */
      --musa: #d96010;
      --musa-light: #fff3e0;
      --musa-text: #7a3800;
      --musa-border: #e8c080;
      /* 武蔵野線: 紫（府中本町行以外＝大宮・東所沢・西船橋など） */
      --musa2: #7c3aed;
      --musa2-light: #f1e8ff;
      --musa2-text: #4c1d8a;
      --musa2-border: #c8a8f0;
      /* バス: 青 */
      --bus: #1a6ec0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1920×1080の固定キャンバス。JSで画面サイズに合わせて等比スケール */
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 14px 22px;
      gap: 10px;
      transform-origin: center center;
    }

    /* ── Header ── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex-shrink: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .station-label {
      font-size: 20px;
      color: var(--muted);
      letter-spacing: 2px;
      font-weight: 600;
    }

    .clock-area { text-align: center; }

    .clock {
      font-size: 96px;
      font-weight: 700;
      font-family: 'Consolas', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--text);
    }

    .date-display {
      font-size: 20px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 1px;
      font-weight: 600;
      text-align: right;
    }

    .header-right { text-align: right; font-size: 14px; color: var(--muted); }
    .refresh-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 6px;
      box-shadow: var(--shadow);
    }
    .refresh-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── 横画面メイン（左:電車 / 右:バス・天気） ── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 12px;
    }
    .main-left  { flex: 1.75; min-width: 0; display: flex; }
    .main-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    /* 電車カードは左カラム全体を埋める */
    #trainCard    { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    #busCard      { flex: 0 0 auto; }
    #weatherCard  { flex: 0 0 auto; }
    #forecastCard { flex: 1 1 auto; min-height: 0; overflow: hidden; margin-bottom: 0; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    /* ── Weather ── */
    .weather-now {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .weather-icon { font-size: 74px; line-height: 1; }

    .weather-temp {
      font-size: 74px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }

    .weather-desc { font-size: 22px; color: var(--muted); margin-top: 6px; }

    .weather-meta {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 18px;
      color: var(--muted);
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .weather-meta span { display: flex; align-items: center; gap: 4px; }

    /* ── Forecast ── */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .forecast-day {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .forecast-day .day-label { color: var(--muted); margin-bottom: 4px; font-weight: 700; font-size: 19px; }
    .forecast-day .day-icon  { font-size: 34px; margin: 6px 0; }
    .forecast-day .day-high  { color: #c0392b; font-weight: 800; font-size: 21px; }
    .forecast-day .day-low   { color: #2980b9; font-size: 19px; }

    /* ── Train / Bus direction ── */
    .train-direction {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .direction-badge {
      color: #fff;
      font-size: 21px;
      padding: 6px 18px;
      border-radius: 6px;
      font-weight: 700;
    }

    /* 京葉線: 赤 */
    .badge-keiyo     { background: var(--keiyo); }
    /* 武蔵野線: オレンジ */
    .badge-musashino { background: var(--musa); }
    /* バス: 青 */
    .badge-bus       { background: var(--bus); }

    /* ── 電車 2カラム ── */
    .train-cols { display: flex; gap: 14px; flex: 1; min-height: 0; }
    .train-col  { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .train-col-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }
    .train-items-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .train-items-wrap .train-item { margin-bottom: 0; flex: 1; }

    .train-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 12px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .train-item .dest-badge { width: auto; min-width: 86px; flex-shrink: 0; }
    .train-item .badge-wrap { width: 86px; flex-shrink: 0; }
    .train-item .badge-wrap .dest-badge { width: 100%; min-width: 0; }
    .train-item .train-time { flex: 1; min-width: 0; }
    .train-item .train-countdown { flex-shrink: 0; }

    /* 始発バッジ：行き先バッジと同じサイズ・デザインで、その上に積む */
    .badge-wrap { display: flex; flex-direction: column; gap: 3px; }
    .seat-tag {
      display: block;
      width: 100%;
      font-size: 18px;
      padding: 5px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
      color: var(--green);
      background: #e8f8ee;
      border: 1px solid #a0d8b8;
    }

    /* 路線別 左アクセントカラー */
    .item-keiyo     { border-left-color: var(--keiyo); }
    .item-musashino { border-left-color: var(--musa); }
    .item-bus       { border-left-color: var(--bus); }

    /* 行き先バッジ：固定幅で揃える */
    .dest-badge {
      font-size: 18px; padding: 5px 8px; border-radius: 6px;
      font-weight: 700; text-align: center; width: 100%;
    }
    /* 京葉線系（赤） */
    .dest-tokyo { background: var(--keiyo-light); color: var(--keiyo-text); border: 1px solid var(--keiyo-border); }
    /* 武蔵野線系：府中本町行はオレンジ、それ以外は紫で区別 */
    .dest-fuchu      { background: var(--musa-light); color: var(--musa-text); border: 1px solid var(--musa-border); }
    .dest-tokorozawa { background: var(--musa2-light); color: var(--musa2-text); border: 1px solid var(--musa2-border); }
    .dest-omiya      { background: var(--musa2-light); color: var(--musa2-text); border: 1px solid var(--musa2-border); }
    .dest-nishifuna  { background: var(--musa2-light); color: var(--musa2-text); border: 1px solid var(--musa2-border); }
    /* バス */
    .dest-tsudanuma  { background: #ddf0f8; color: #1a5070; border: 1px solid #80c8e8; }

    .train-time {
      font-weight: 800; font-size: 62px; color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 1px;
      line-height: 1; /* 文字を大きくしても行の高さ＝枠サイズを変えない */
    }
    /* 電車カード・バスカードの発車時刻を大きく（枠は等高フレックスで固定なので変わらない） */
    #trainCard .train-time, #busCard .train-time { font-size: 96px; }

    .train-countdown {
      font-size: 27px;
      padding: 5px 10px;
      border-radius: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* カウントダウン色: 赤<10分 / オレンジ<15分 / 青<20分 / グレー20分以上 */
    .countdown-soon   { background: #fde8ea; color: #c0202e; border: 1px solid #f5b0b8; }
    .countdown-orange { background: #fff0e0; color: #c06010; border: 1px solid #f0c080; }
    .countdown-near   { background: #e0eaff; color: #1a4aaa; border: 1px solid #a0c0f0; }
    .countdown-far    { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }

    .service-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 8px;
    }

    .service-status.normal { background: #e8f8ee; border: 1px solid #a0d8b8; color: var(--green); }
    .service-status.delay  { background: #fffbe6; border: 1px solid #e8d080; color: var(--yellow); }
    .service-status.stop   { background: #fdecea; border: 1px solid #f0a8a8; color: var(--accent2); }

    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.normal { background: var(--green); }
    .status-dot.delay  { background: var(--yellow); }
    .status-dot.stop   { background: var(--accent2); }

    .ext-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
    }
    .ext-link:hover { background: #e8eeff; }

    .loading { color: var(--muted); font-size: 18px; }

    /* バス */
    .train-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .note { font-size: 12px; color: var(--muted); padding: 5px 10px; background: var(--card2); border-radius: 6px; border: 1px solid var(--border); }

    /* ── 縦画面（スマホ）: 幅1100pxで縦に積み、画面幅に合わせてzoom。縦スクロール ── */
    html.portrait, html.portrait body { height: auto; }
    html.portrait body { overflow-y: auto; overflow-x: hidden; display: block; min-height: 100vh; }
    html.portrait #stage { width: 1100px; height: auto; min-height: var(--vh, 0px); transform: none; }
    html.portrait .main { flex-direction: column; flex: 1 1 auto; }
    html.portrait .main-left { flex: 1 1 auto; width: 100%; }
    html.portrait .main-right { width: 100%; }
    html.portrait #trainCard { flex: 1 1 auto; width: 100%; height: auto; overflow: visible; }
    html.portrait #trainCard .train-time, html.portrait #busCard .train-time {
      font-family: ui-monospace, 'SF Mono', Menlo, 'Courier New', monospace; font-size: 58px; letter-spacing: 0; white-space: nowrap; }
    html.portrait #trainCard .train-countdown, html.portrait #busCard .train-countdown { font-size: 24px; padding: 3px 8px; }
    html.portrait #trainCard .dest-badge { font-size: 20px; }
    html.portrait #trainCard .train-item { gap: 6px; padding-left: 6px; padding-right: 6px; }
    html.portrait #busCard .train-time { font-size: 68px; }
    html.portrait #busCard .train-countdown { font-size: 28px; padding: 5px 12px; }
    html.portrait #busCard .dest-badge { font-size: 22px; width: auto; min-width: 0; padding-left: 10px; padding-right: 10px; }
    html.portrait #busCard .badge-wrap { width: auto; }
    html.portrait #busCard .train-item { padding-top: 10px; padding-bottom: 10px; gap: 12px; }
    html.portrait #busCard .card-title { font-size: 20px; }
    html.portrait #forecastCard { flex: none; }
    html.portrait .clock { font-size: 72px; }
    html.portrait .main-right { display: contents; }
    html.portrait #busCard { order: -1; width: 100%; }
    html.portrait #weatherCard, html.portrait #forecastCard { display: none; }

    /* ── Lucide アイコン ── */
    .lucide { width: 1.15em; height: 1.15em; stroke-width: 2; vertical-align: -0.2em; flex-shrink: 0; }
    .card-title .lucide, .refresh-btn .lucide { margin-right: 4px; }
    .weather-icon, .forecast-day .day-icon { color: var(--accent); }
    .weather-icon .lucide, .forecast-day .day-icon .lucide { width: 1em; height: 1em; stroke-width: 1.6; margin: 0; vertical-align: middle; }
    .weather-meta .lucide { width: 1em; height: 1em; }
  </style>
</head>
<body>
<div id="stage">

<!-- ── Header ── -->
<div class="header">
  <div>
    <div class="station-label">新習志野駅</div>
  </div>
  <div class="clock-area">
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="header-right">
    <div class="date-display" id="dateDisplay">読み込み中...</div>
    <div id="lastUpdated">-</div>
    <button class="refresh-btn" onclick="refresh()"><i data-lucide="refresh-cw"></i> 更新</button>
  </div>
</div>

<!-- ── 横画面メイン ── -->
<div class="main">
  <!-- 左：電車 -->
  <div class="main-left">
    <div class="card" id="trainCard">
      <div class="card-title"><i data-lucide="train-front"></i> 次の電車 — 参考時刻</div>
      <div class="loading">時刻を計算中...</div>
    </div>
  </div>

  <!-- 右：バス・天気 -->
  <div class="main-right">
    <!-- バス -->
    <div class="card" id="busCard">
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）</div>
      <div class="loading">時刻を計算中...</div>
    </div>

    <!-- 天気 -->
    <div class="card" id="weatherCard">
      <div class="card-title"><i data-lucide="cloud"></i> 現在の天気 — 新習志野</div>
      <div class="loading">天気情報を取得中...</div>
    </div>

    <!-- 週間予報 -->
    <div class="card" id="forecastCard">
      <div class="card-title"><i data-lucide="calendar-days"></i> 週間天気予報</div>
      <div class="loading">予報を取得中...</div>
    </div>
  </div>
</div>

</div><!-- /#stage -->

<script>
// ─────────────────────────────────────────
// 画面フィット（1920×1080キャンバスを等比スケール）
// ─────────────────────────────────────────
function fitStage() {
  const stage = document.getElementById('stage');
  if (!stage) return;
  const portrait = window.innerHeight > window.innerWidth;
  document.documentElement.classList.toggle('portrait', portrait);
  if (portrait) {
    stage.style.transform = '';
    const z = window.innerWidth / 1100;
    stage.style.zoom = z;
    stage.style.setProperty('--vh', (window.innerHeight / z) + 'px');
  } else {
    stage.style.zoom = '';
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${scale})`;
  }
}
window.addEventListener('resize', fitStage);
fitStage();

// ─────────────────────────────────────────
// 時計
// ─────────────────────────────────────────
const WEEKDAYS = ['日','月','火','水','木','金','土'];

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;

  const wd = WEEKDAYS[now.getDay()];
  document.getElementById('dateDisplay').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${wd}）`;
}
setInterval(updateClock, 1000);
updateClock();

// ─────────────────────────────────────────
// 天気 (Open-Meteo)
// ─────────────────────────────────────────
const LAT = 35.6533, LON = 140.0258;

const WMO_MAP = {
  0: ['sun','快晴'],
  1: ['cloud-sun','おおむね晴れ'], 2: ['cloud-sun','一部曇り'], 3: ['cloud','曇り'],
  45: ['cloud-fog','霧'], 48: ['cloud-fog','霧氷'],
  51: ['cloud-drizzle','霧雨（弱）'], 53: ['cloud-drizzle','霧雨'], 55: ['cloud-rain','霧雨（強）'],
  61: ['cloud-rain','小雨'], 63: ['cloud-rain','雨'], 65: ['cloud-rain','大雨'],
  71: ['cloud-snow','小雪'], 73: ['cloud-snow','雪'], 75: ['snowflake','大雪'],
  77: ['cloud-snow','霧雪'],
  80: ['cloud-drizzle','にわか雨（弱）'], 81: ['cloud-drizzle','にわか雨'], 82: ['cloud-lightning','強いにわか雨'],
  95: ['cloud-lightning','雷雨'], 96: ['cloud-lightning','雷雨（霰）'], 99: ['cloud-lightning','激しい雷雨'],
};

function wmoInfo(code) {
  const [n, d] = WMO_MAP[code] || ['thermometer','不明'];
  return [`<i data-lucide="${n}"></i>`, d];
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + `&current=temperature_2m,relativehumidity_2m,windspeed_10m,weathercode,precipitation`
      + `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode`
      + `&forecast_days=7&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();

    const c = data.current;
    const d = data.daily;
    const [icon, desc] = wmoInfo(c.weathercode);

    // 明日の天気
    const [iconTomorrow, descTomorrow] = wmoInfo(d.weathercode[1]);
    const highTomorrow = Math.round(d.temperature_2m_max[1]);
    const lowTomorrow = Math.round(d.temperature_2m_min[1]);

    // 現在天気
    document.getElementById('weatherCard').innerHTML = `
      <div class="card-title"><i data-lucide="cloud"></i> 現在の天気 — 新習志野</div>
      <div class="weather-now">
        <div style="flex:1;display:flex;align-items:center;gap:12px">
          <div class="weather-icon">${icon}</div>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div style="width:1px;background:var(--border);align-self:stretch;margin:0 14px;flex-shrink:0"></div>
        <div style="flex:1;display:flex;align-items:center;gap:12px">
          <div class="weather-icon">${iconTomorrow}</div>
          <div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:2px">明日の天気</div>
            <div class="weather-temp">${highTomorrow}<span style="font-size:20px;color:var(--muted)">/${lowTomorrow}</span></div>
            <div class="weather-desc">${descTomorrow}</div>
          </div>
        </div>
      </div>
      <div class="weather-meta">
        <span><i data-lucide="droplets"></i> 湿度 ${c.relativehumidity_2m}%</span>
        <span><i data-lucide="wind"></i> 風速 ${c.windspeed_10m} m/s</span>
        <span><i data-lucide="cloud-rain"></i> 降水 ${c.precipitation} mm</span>
        <span><i data-lucide="arrow-up"></i>${Math.round(d.temperature_2m_max[0])} <i data-lucide="arrow-down"></i>${Math.round(d.temperature_2m_min[0])}</span>
      </div>
    `;

    // 週間予報（今日は上の現在天気で表示済みのため、明日以降の6日分のみ）
    const days = d.time.slice(1, 7);
    const forecastHTML = days.map((date, i) => {
      const idx = i + 1;
      const dt = new Date(date);
      const wd = WEEKDAYS[dt.getDay()];
      const [fi, fd] = wmoInfo(d.weathercode[idx]);
      return `
        <div class="forecast-day">
          <div class="day-label">${i === 0 ? '明日' : wd}</div>

// 2026年（令和8年）国民の祝日・振替休日・国民の休日
// 出典: 内閣府「国民の祝日」（土日と重複する日を除く、平日に当たる祝日のみ判定に必要だが網羅的に列挙）
const HOLIDAYS_2026 = new Set([
  '2026-01-01', // 元日
  '2026-01-12', // 成人の日
  '2026-02-11', // 建国記念の日
  '2026-02-23', // 天皇誕生日
  '2026-03-20', // 春分の日
  '2026-04-29', // 昭和の日
  '2026-05-03', // 憲法記念日
  '2026-05-04', // みどりの日
  '2026-05-05', // こどもの日
  '2026-05-06', // 振替休日
  '2026-07-20', // 海の日
  '2026-08-11', // 山の日
  '2026-09-21', // 敬老の日
  '2026-09-22', // 国民の休日
  '2026-09-23', // 秋分の日
  '2026-10-12', // スポーツの日
  '2026-11-03', // 文化の日
  '2026-11-23', // 勤労感謝の日
]);

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// 電車（JR）用の曜日種別: 土日に加え、平日の国民の祝日も「休日」扱い
function getTrainDayType(date) {
  const d = date.getDay();
  if (d === 0) return 'holiday';
  if (d === 6) return 'saturday';
  if (HOLIDAYS_2026.has(dateKey(date))) return 'holiday'; // 平日の祝日
  return 'weekday';
}

function isHoliday(date = new Date()) {
  return getTrainDayType(date) !== 'weekday';
}

// 大学バス用の曜日種別: 大学独自運行のため国民の祝日は考慮せず、曜日のみで判定
function getBusDayType(date) {
  const d = date.getDay();
  if (d === 0) return 'holiday';
  if (d === 6) return 'saturday';
  return 'weekday';
}

function getNextTrains(direction, n = 3) {
  const now = new Date();
  const curH = now.getHours();
  const curM = now.getMinutes();
  const curTotal = curH * 60 + curM;

  const sched = isHoliday() ? SCHED.holiday : SCHED.weekday;
  const tbl = sched[direction];

  const upcoming = [];
  for (let h = curH; h <= 23 && upcoming.length < n; h++) {
    const entries = tbl[h] || [];
    for (const e of entries) {
      const t = h * 60 + e.m;
      if (t > curTotal) {
        upcoming.push({ h, m: e.m, dest: e.d, diffMin: t - curTotal, s: e.s });
      }
      if (upcoming.length >= n) break;
    }
  }

  // 翌日への繰り越しはしない（その日の終電を過ぎた方面は空のまま＝「本日終了」表示）
  return upcoming;
}

function countdownLabel(diff) {
  if (diff <= 0)  return { label: 'まもなく', cls: 'countdown-soon' };
  if (diff < 10)  return { label: `あと${diff}分`, cls: 'countdown-soon' };   // 赤
  if (diff < 15)  return { label: `あと${diff}分`, cls: 'countdown-orange' }; // オレンジ
  if (diff < 20)  return { label: `あと${diff}分`, cls: 'countdown-near' };   // 青
  return          { label: `あと${diff}分`, cls: 'countdown-far' };            // グレー
}

function destClass(d) {
  if (d === '東京') return 'dest-tokyo';
  if (d === '西船橋') return 'dest-nishifuna';
  if (d === '府中本町') return 'dest-fuchu';
  if (d === '東所沢') return 'dest-tokorozawa';
  if (d === '大宮') return 'dest-omiya';
  return 'dest-tokyo';
}

// 行き先バッジ（始発なら同じデザインの緑バッジを上に積む）
function destBadgeHTML(cls, dest, isSeat) {
  const badge = `<span class="dest-badge ${cls}">${dest}</span>`;
  if (!isSeat) return badge;
  return `<div class="badge-wrap"><span class="seat-tag">始発</span>${badge}</div>`;
}

function renderTrains() {
  const tokyoTrains = getNextTrains('tokyo', 5);
  const musaTrains  = getNextTrains('musashino', 5);
  const dayType = isHoliday() ? '土休日' : '平日';

  function trainRows(trains, itemCls) {
    if (trains.length === 0) {
      return `<div class="train-items-wrap"><div style="color:var(--muted);font-size:18px;padding:14px 16px;background:var(--card2);border:1px solid var(--border);border-radius:10px">本日の運行は終了しました</div></div>`;
    }
    const items = trains.map(tr => {
      const hh = String(tr.h % 24).padStart(2,'0');
      const mm = String(tr.m).padStart(2,'0');
      const { label, cls } = countdownLabel(tr.diffMin);
      return `
        <div class="train-item ${itemCls}">
          ${destBadgeHTML(destClass(tr.dest), tr.dest, tr.s)}
          <span class="train-time">${hh}:${mm}</span>
          <span class="train-countdown ${cls}">${label}</span>
        </div>`;
    }).join('');
    return `<div class="train-items-wrap">${items}</div>`;
  }

  document.getElementById('trainCard').innerHTML = `
    <div class="card-title"><i data-lucide="train-front"></i> 次の電車 — ${dayType}（JR東日本公式時刻表）</div>
    <div class="train-cols">
      <div class="train-col">

          <span class="direction-badge badge-keiyo">東京方面（京葉線・普通）</span>
        </div>
        ${trainRows(tokyoTrains, 'item-keiyo')}
      </div>
      <div class="train-col-divider"></div>
      <div class="train-col">
        <div class="train-direction" style="flex-shrink:0">
          <span class="direction-badge badge-musashino">府中本町方面（武蔵野線）</span>
        </div>
        ${trainRows(musaTrains, 'item-musashino')}
      </div>
    </div>
    <div class="service-status normal" style="justify-content:space-between;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:7px">
        <div class="status-dot normal"></div>
        <span>運行情報は公式サイトで確認</span>
      </div>
      <div style="display:flex;gap:6px">
        <a class="ext-link" href="https://traininfo.jreast.co.jp/train_info/line.aspx?gid=1&lineid=keiyoline" target="_blank" style="font-size:12px;padding:2px 8px;border-color:var(--keiyo);color:var(--keiyo)">京葉線</a>
        <a class="ext-link" href="https://traininfo.jreast.co.jp/train_info/line.aspx?gid=1&lineid=musashinoline" target="_blank" style="font-size:12px;padding:2px 8px;border-color:var(--musa);color:var(--musa)">武蔵野線</a>

  10: [{m:0}],
  12: [{m:0}],
  15: [{m:0}],
  17: [{m:0}],
};

// 集中講義期間ダイヤ（8/17〜8/31。うち8/22-24, 29-30は夏期期間中ダイヤを使用）
const BUS_SCHED_INTENSIVE = {
  monToSat: {
    9:  [{m:10},{m:45}],
    10: [{m:30}],
    11: [{m:25}],
    12: [{m:20}],
    13: [{m:20}],
    14: [{m:10}],
    15: [{m:0}],
    16: [{m:20}],
    17: [{m:10}],
    18: [{m:0}],
  },
  sunday: {
    9:  [{m:0}],
    10: [{m:0}],
    12: [{m:0}],
    15: [{m:0}],
    17: [{m:0}],
  }
};

// 令和8年度後期バスダイヤ（9/17〜12/23、新習志野発 → 津田沼行）
const BUS_SCHED_AUTUMN = {
  weekday: {
    8:  [{m:35}],
    9:  [{m:10},{m:20}],
    10: [{m:10},{m:20}],
    11: [{m:10},{m:30}],
    12: [{m:20},{m:30}],
    13: [{m:15},{m:50}],
    14: [{m:15},{m:45}],
    15: [{m:20},{m:50}],
    16: [{m:15},{m:40}],
    17: [{m:20},{m:40}],
    18: [{m:15},{m:40}], // 15分発は茜浜運動施設20分発
    19: [{m:10},{m:40}], // 40分発は茜浜運動施設45分発
    20: [{m:10}],        // 茜浜運動施設15分発
  },
  saturday: {
    8:  [{m:35}],
    10: [{m:40}],
    11: [{m:40}],
    12: [{m:20},{m:50}],
    13: [{m:20}],
    15: [{m:20}],
    16: [{m:10}],
    17: [{m:20}],
    18: [{m:10}], // 茜浜運動施設15分発
    19: [{m:40}], // 茜浜運動施設45分発
  },
  holiday: {
    9:  [{m:0}],
    10: [{m:0}],
    12: [{m:0}],
    15: [{m:0}],
  },
  dec23: {
    9:  [{m:0}],
    10: [{m:0}],
    12: [{m:0}],
  },
};

// 日付(month*100+day)から適用ダイヤを判定
function getBusContext(date) {
  const md = (date.getMonth() + 1) * 100 + date.getDate();
  const y = date.getFullYear();

  if (md === 723) {
    return { table: BUS_SCHED_COMMON_TEST, label: '前期共通試験ダイヤ（7/23）' };
  }
  if (md === 801) {
    return { unknown: true, label: '8/1は別ダイヤ運行（詳細は公式サイトをご確認ください）' };
  }
  if (md >= 808 && md <= 816) {
    return { closed: true, label: '運休期間（8/8〜8/16）' };
  }
  const isSummerMainDate =
    (md >= 724 && md <= 807) ||
    [822, 823, 824, 829, 830].includes(md) ||
    (md >= 901 && md <= 916);
  if (isSummerMainDate) {
    return { table: BUS_SCHED_SUMMER, label: '夏期期間中ダイヤ' };
  }
  if (md >= 817 && md <= 831) {
    const table = getBusDayType(date) === 'holiday' ? BUS_SCHED_INTENSIVE.sunday : BUS_SCHED_INTENSIVE.monToSat;
    return { table, label: '集中講義期間ダイヤ' };
  }

  // 令和8年度後期バスダイヤ（9/17〜12/22）
  if (y === 2026 && md >= 917 && md <= 1222) {
    const type = getBusDayType(date);
    const typeLabel = { weekday: '平日', saturday: '土曜', holiday: '日曜' }[type];
    return { table: BUS_SCHED_AUTUMN[type], label: `後期ダイヤ・${typeLabel}` };
  }
  // 12/23（水）は午後運休のため午前のみの特別ダイヤ
  if (y === 2026 && md === 1223) {
    return { table: BUS_SCHED_AUTUMN.dec23, label: '12/23（水）ダイヤ・午後運休' };
  }
  // 冬季運休期間（12/23午後〜1/11）
  if ((y === 2026 && md >= 1224) || (y === 2027 && md <= 111)) {
    return { closed: true, label: '冬季運休期間（12/23午後〜1/11）' };
  }

  // 2027年度ダイヤ未登録のため、1/12以降はダイヤ未更新として扱う
  const UNCOVERED_FROM = new Date(2027, 0, 12); // 2027-01-12 0:00
  if (date >= UNCOVERED_FROM) {
    return { needsUpdate: true, label: 'バスダイヤを更新してください' };
  }

  const type = getBusDayType(date);
  const typeLabel = { weekday: '平日', saturday: '土曜', holiday: '日曜' }[type];
  return { table: BUS_SCHED_REGULAR[type], label: `通常ダイヤ・${typeLabel}` };
}

function getNextBuses(n = 2) {
  const now = new Date();
  const curH = now.getHours();
  const curM = now.getMinutes();
  const curTotal = curH * 60 + curM;

  const ctx = getBusContext(now);
  if (ctx.closed || ctx.unknown || ctx.needsUpdate) {
    return { ctx, buses: [] };
  }

  const tbl = ctx.table;
  const upcoming = [];

  for (let h = curH; h <= 23 && upcoming.length < n; h++) {
    for (const e of (tbl[h] || [])) {
      const t = h * 60 + e.m;
      if (t > curTotal) {
        upcoming.push({ h, m: e.m, diffMin: t - curTotal });
      }
      if (upcoming.length >= n) break;
    }
  }

  return { ctx, buses: upcoming };
}

function renderBus() {
  const { ctx, buses } = getNextBuses(2);

  if (ctx.closed) {
    document.getElementById('busCard').innerHTML = `
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）</div>
      <div style="color:var(--muted);font-size:14px;padding:6px 0">本日は運休です</div>
      <div class="note">${ctx.label}</div>
    `;
    return;
  }
  if (ctx.unknown) {
    document.getElementById('busCard').innerHTML = `
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）</div>
      <div style="color:var(--muted);font-size:14px;padding:6px 0">運行情報が確認できません</div>
      <div class="note">${ctx.label}</div>
    `;
    return;
  }
  if (ctx.needsUpdate) {
    document.getElementById('busCard').innerHTML = `
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）</div>
      <div style="color:var(--accent2);font-size:16px;padding:6px 0;font-weight:700"><i data-lucide="triangle-alert"></i> バスダイヤを更新してください</div>
      <div class="note">9/16までのダイヤしか登録されていません</div>
    `;
    return;
  }

  if (buses.length === 0) {
    document.getElementById('busCard').innerHTML = `
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）— ${ctx.label}</div>
      <div style="color:var(--muted);font-size:14px;padding:6px 0">本日の運行は終了しました</div>
      <div class="note">${ctx.label}</div>
    `;
    return;
  }

  const rows = buses.map(b => {
    const hh = String(b.h).padStart(2,'0');
    const mm = String(b.m).padStart(2,'0');
    const { label, cls } = countdownLabel(b.diffMin);
    return `
      <div class="train-item item-bus">
        <span class="dest-badge dest-tsudanuma">津田沼</span>
        <span class="train-time">${hh}:${mm}</span>
        <span class="train-countdown ${cls}">${label}</span>
      </div>`;
  }).join('');

  document.getElementById('busCard').innerHTML = `
    <div class="card-title"><i data-lucide="bus"></i> 大学バス（新習志野発 → 津田沼行）— ${ctx.label}</div>
    <div class="train-list">${rows}</div>
    <div class="note">${ctx.label} · ※茜浜経由便は別途運行あり</div>
  `;
}

// ─────────────────────────────────────────
// 自動更新
// ─────────────────────────────────────────
function updateLastUpdated() {
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('lastUpdated').textContent = `更新: ${t}`;
}

// 電車・バス: 毎分0秒ちょうどに更新（壁時計に同期）
function tickMinute() {
  renderTrains();
  renderBus();
  updateLastUpdated();
}
function scheduleMinuteTick() {
  const now = new Date();
  const msToNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
  setTimeout(() => {
    tickMinute();
    setInterval(tickMinute, 60 * 1000);
  }, msToNextMinute);
}
scheduleMinuteTick();

// 天気: 10分ごと
setInterval(fetchWeather, 10 * 60 * 1000);

renderTrains();
renderBus();

// ─────────────────────────────────────────
// 全体更新
// ─────────────────────────────────────────
function refresh() {
  fetchWeather();
  renderTrains();
  renderBus();
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    `更新: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

refresh();
</script>
<script>
// Lucide: 動的に描画された <i data-lucide> を随時SVGに置換
(function () {
  let t = null;
  function run() {
    if (typeof lucide === 'undefined') return;
    if (document.querySelector('i[data-lucide]')) lucide.createIcons();
  }
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(run, 0); })
    .observe(document.body, { childList: true, subtree: true });
  run();
})();
</script>
