<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>津田沼ダッシュボード</title>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    /* 横置きモニター（16:9）スクロールなし全画面フィット ── 約1920×1080想定 */
    :root {
      --bg: #eef0f8;
      --card: #ffffff;
      --card2: #f4f6fb;
      --accent: #2f6de0;
      --accent2: #d93a50;
      --green: #1a8a56;
      --yellow: #b8860b;
      --text: #1a1d2e;
      --muted: #6b7490;
      --border: #dde1ef;
      --shadow: 0 3px 12px rgba(30,40,80,0.09);
      /* 総武緩行線: 黄色 */
      --sobu: #d4a000;
      --sobu-light: #fffbe0;
      --sobu-text: #5a3d00;
      --sobu-border: #e8d070;
      /* 武蔵野線: オレンジ */
      --musa: #d96010;
      --musa-light: #fff3e0;
      --musa-text: #7a3800;
      --musa-border: #e8c080;
      /* 総武快速線（横須賀・総武快速）: 青 */
      --kaisoku: #0072bc;
      --kaisoku-light: #e8f1fc;
      --kaisoku-text: #0a4a8c;
      --kaisoku-border: #9cc2ee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1920×1080の固定キャンバス。JSで画面サイズに合わせて等比スケール */
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 14px 22px;
      gap: 10px;
      transform-origin: center center;
    }

    /* ── Header ── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex-shrink: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .station-label {
      font-size: 20px;
      color: var(--muted);
      letter-spacing: 2px;
      font-weight: 600;
    }

    .clock-area { text-align: center; }

    .clock {
      font-size: 88px;
      font-weight: 700;
      font-family: 'Consolas', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--text);
    }

    .date-display {
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .header-right { text-align: right; font-size: 14px; color: var(--muted); }
    .refresh-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 6px;
      box-shadow: var(--shadow);
    }
    .refresh-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── 横画面メイン（左:電車 / 右:バス・天気） ── */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 12px;
    }
    .main-left  { flex: 1.75; min-width: 0; display: flex; }
    .main-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    /* 電車カードは左カラム全体を埋める */
    #trainCard    { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    #busCard      { flex: 0 0 auto; }
    #weatherCard  { flex: 0 0 auto; }
    #forecastCard { flex: 1 1 auto; min-height: 0; overflow: hidden; margin-bottom: 0; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    /* ── Weather ── */
    .weather-now {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .weather-icon { font-size: 58px; line-height: 1; }

    .weather-temp {
      font-size: 58px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }

    .weather-desc { font-size: 18px; color: var(--muted); margin-top: 6px; }

    .weather-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 16px;
      color: var(--muted);
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .weather-meta span { display: flex; align-items: center; gap: 4px; }

    /* ── Forecast ── */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .forecast-day {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .forecast-day .day-label { color: var(--muted); margin-bottom: 4px; font-weight: 700; font-size: 18px; }
    .forecast-day .day-icon  { font-size: 34px; margin: 6px 0; }
    .forecast-day .day-high  { color: #c0392b; font-weight: 800; font-size: 20px; }
    .forecast-day .day-low   { color: #2980b9; font-size: 18px; }

    /* ── Train direction ── */
    .train-direction {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .direction-badge {
      color: #fff;
      font-size: 21px;
      padding: 6px 18px;
      border-radius: 6px;
      font-weight: 700;
    }

    .transfer-note {
      font-size: 13px;
      color: var(--muted);
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    /* 総武緩行線: 黄色 */
    .badge-sobu      { background: var(--sobu); }
    /* 武蔵野線: オレンジ */
    .badge-musashino { background: var(--musa); }
    /* 総武快速線: 青 */
    .badge-kaisoku   { background: var(--kaisoku); }

    /* ── 電車カード内：横3カラム（快速 | 各停+武蔵野連動） ── */
    .train-body {
      display: flex;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }
    .train-line-col   { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .train-paired-col { flex: 2; min-width: 0; display: flex; flex-direction: column; }
    .train-line-head  { margin-bottom: 10px; flex-shrink: 0; min-height: 56px; }
    .train-line-list  {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .train-line-list .train-item { margin: 0; flex: 1; }
    .subnote { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* 始発バッジ：行き先バッジと同じサイズ・デザインで、その上に積む */
    .badge-wrap { display: flex; flex-direction: column; gap: 3px; }
    .badge-wrap .dest-badge { width: 100%; }
    .seat-tag {
      display: block;
      width: 100%;
      font-size: 18px;
      padding: 5px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
      color: var(--green);
      background: #e8f8ee;
      border: 1px solid #a0d8b8;
    }

    /* 電車 2カラム */
    .train-cols { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .train-col  { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .train-col-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }
    .train-items-wrap { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
    .train-items-wrap .train-item { margin-bottom: 0; }

    /* ── 連動ペア表示 ── */
    .train-header-row {
      display: grid;
      grid-template-columns: 1fr 2px 1fr;
      gap: 0 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
      min-height: 56px;
    }
    .paired-rows {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .paired-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2px 1fr;
      gap: 0 12px;
      align-items: stretch;
    }
    .paired-row .train-item { margin: 0; }
    .col-divider { background: var(--border); align-self: stretch; }

    .train-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 10px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .train-item .dest-badge { width: 82px; flex-shrink: 0; white-space: nowrap; padding-left: 2px; padding-right: 2px; }
    .train-item .badge-wrap { width: 82px; flex-shrink: 0; }
    .train-item .badge-wrap .dest-badge { padding-left: 2px; padding-right: 2px; }
    .train-item .train-time { flex: 1; min-width: 0; }
    .train-item .train-countdown { width: 68px; flex-shrink: 0; text-align: center; padding-left: 2px; padding-right: 2px; }

    /* 路線別 左アクセントカラー */
    .item-kaisoku   { border-left-color: var(--kaisoku); }
    .item-sobu      { border-left-color: var(--sobu); }
    .item-musashino { border-left-color: var(--musa); }
    .item-bus       { border-left-color: var(--green); }

    /* 行き先バッジ：固定幅で揃える */
    .dest-badge {
      font-size: 18px; padding: 5px 8px; border-radius: 6px;
      font-weight: 700; text-align: center; width: 100%;
    }

    /* 総武緩行線系（黄色） */
    .dest-mitaka  { background: var(--sobu-light); color: var(--sobu-text); border: 1px solid var(--sobu-border); }
    .dest-nakano  { background: #fff8e0; color: #6a4800; border: 1px solid #d8c060; }

    /* 総武快速線系（青） */
    .dest-tokyo    { background: #d7e7fb; color: #08407e; border: 1px solid #8fb8e8; font-weight: 800; }
    .dest-yokosuka { background: var(--kaisoku-light); color: var(--kaisoku-text); border: 1px solid var(--kaisoku-border); }

    /* 東西線直通（水色） */
    .dest-tozai { background: #e0f7fb; color: #0a6478; border: 1px solid #8fd8e8; }

    /* 武蔵野線系（オレンジ） */
    .dest-fuchu      { background: var(--musa-light); color: var(--musa-text); border: 1px solid var(--musa-border); }
    .dest-tokorozawa { background: #fff8f0; color: #8a5000; border: 1px solid #d8b870; }
    .dest-omiya      { background: #eef0ff; color: #3030a0; border: 1px solid #9090d8; }
    .dest-yoshikawa  { background: #fff8f0; color: #8a5000; border: 1px solid #d8b870; }

    .train-time {
      font-weight: 800; font-size: 60px; color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .train-countdown {
      font-size: 21px;
      padding: 4px 14px;
      border-radius: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* カウントダウン色 */
    .countdown-soon   { background: #fde8ea; color: #c0202e; border: 1px solid #f5b0b8; }
    .countdown-orange { background: #fff0e0; color: #c06010; border: 1px solid #f0c080; }
    .countdown-near   { background: #e0eaff; color: #1a4aaa; border: 1px solid #a0c0f0; }
    .countdown-far    { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }

    .service-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 8px;
    }

    .service-status.normal { background: #e8f8ee; border: 1px solid #a0d8b8; color: var(--green); }
    .service-status.delay  { background: #fffbe6; border: 1px solid #e8d080; color: var(--yellow); }
    .service-status.stop   { background: #fdecea; border: 1px solid #f0a8a8; color: var(--accent2); }

    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.normal { background: var(--green); }
    .status-dot.delay  { background: var(--yellow); }
    .status-dot.stop   { background: var(--accent2); }

    .ext-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
    }
    .ext-link:hover { background: #e8eeff; }

    .loading { color: var(--muted); font-size: 18px; }

    /* バス */
    .dest-nishinarashino { background: #e0f0e8; color: #1a5030; border: 1px solid #80c8a0; }
    .train-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .note { font-size: 12px; color: var(--muted); padding: 5px 10px; background: var(--card2); border-radius: 6px; border: 1px solid var(--border); }

    /* ── 縦画面（スマホ）: 幅1100pxで縦に積み、画面幅に合わせてzoom。縦スクロール ──
       iOSの文字自動拡大は止め、縮小表示（約0.35倍）でも読めるよう文字サイズを明示する */
    html.portrait, html.portrait body { height: auto; }
    html.portrait body { overflow-y: auto; overflow-x: hidden; display: block; min-height: 100vh; }
    html.portrait #stage { width: 1100px; height: auto; min-height: var(--vh, 0px); transform: none; }
    html.portrait .main { flex-direction: column; flex: 1 1 auto; }
    html.portrait .main-left { flex: 1 1 auto; width: 100%; }
    html.portrait .main-right { display: contents; }
    html.portrait #busCard { order: -1; width: 100%; }
    html.portrait #weatherCard, html.portrait #forecastCard { display: none; }
    html.portrait #trainCard { flex: 1 1 auto; width: 100%; height: auto; overflow: visible; }
    /* ヘッダー */
    html.portrait .clock { font-size: 80px; }
    html.portrait .date-display { font-size: 26px; }
    html.portrait .header-right { font-size: 24px; }
    html.portrait .refresh-btn { font-size: 24px; padding: 8px 16px; }
    html.portrait .station-switch .cur { font-size: 32px; }
    html.portrait .station-switch .to { font-size: 26px; padding: 6px 14px; }
    /* カード共通 */
    html.portrait .card-title { font-size: 30px; margin-bottom: 12px; }
    html.portrait .direction-badge { font-size: 28px; padding: 6px 12px; white-space: nowrap; }
    html.portrait .subnote { font-size: 24px; white-space: nowrap; }
    html.portrait .note, html.portrait .loading { font-size: 26px; }
    html.portrait .service-status { font-size: 24px; }
    html.portrait .ext-link { font-size: 22px !important; padding: 4px 10px !important; }
    html.portrait #busCard [style*="font-size"] { font-size: 26px !important; }
    /* 行（電車・バス共通）：バッジ枠を固定幅にして時刻・カウントダウンの位置をそろえる */
    html.portrait .train-item { flex-wrap: nowrap; gap: 8px; padding-left: 8px; padding-right: 8px; }
    html.portrait .train-item, html.portrait .train-item * { white-space: nowrap; }
    html.portrait #trainCard .train-item .dest-badge { box-sizing: border-box; min-width: 0; font-size: 26px; padding: 4px 2px; text-align: center; }
    html.portrait #trainCard .train-item .badge-wrap .dest-badge { width: 100%; }
    html.portrait #trainCard .train-item > .dest-badge, html.portrait #trainCard .train-item .badge-wrap { width: 112px; flex-shrink: 0; }
    html.portrait #trainCard .train-item .seat-tag { font-size: 22px; padding: 3px 0; }
    html.portrait .train-time {
      font-family: ui-monospace, 'SF Mono', Menlo, 'Courier New', monospace; letter-spacing: 0; }
    html.portrait #trainCard .train-item .train-time { flex: 1; min-width: 0; font-size: 58px; }
    html.portrait #trainCard .train-item .train-countdown { width: auto; flex-shrink: 0; font-size: 28px; padding: 3px 10px; }
    /* バス */
    html.portrait #busCard .train-time { font-size: 68px; }
    html.portrait #busCard .train-countdown { width: auto; font-size: 30px; padding: 5px 14px; }
    html.portrait #busCard .dest-badge { font-size: 26px; width: auto; min-width: 0; padding-left: 10px; padding-right: 10px; }
    html.portrait #busCard .badge-wrap { width: auto; }
    html.portrait #busCard .train-item { padding-top: 10px; padding-bottom: 10px; gap: 12px; }
    /* 津田沼: 各停＋武蔵野線を2列で上、快速は全幅の行で下 */
    html.portrait .train-body { flex-direction: column; gap: 16px; }
    html.portrait .train-line-col, html.portrait .train-paired-col { flex: 1 1 auto; width: 100%; }
    html.portrait .train-line-head { min-height: 0; }
    html.portrait .train-line-col { order: 2; } /* 快速（あまり使わない）は各停・武蔵野線の下 */
    html.portrait .train-paired-col { order: 1; }
    html.portrait .train-header-row { min-height: 0; }

    /* ── Lucide アイコン ── */
    .lucide { width: 1.15em; height: 1.15em; stroke-width: 2; vertical-align: -0.2em; flex-shrink: 0; }
    .card-title .lucide, .refresh-btn .lucide { margin-right: 4px; }
    .weather-icon, .forecast-day .day-icon { color: var(--accent); }
    .weather-icon .lucide, .forecast-day .day-icon .lucide { width: 1em; height: 1em; stroke-width: 1.6; margin: 0; vertical-align: middle; }
    .weather-meta .lucide { width: 1em; height: 1em; }

    /* ── 駅の切り替え（ヘッダー左） ── */
    .station-switch { display: inline-flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
    .station-switch .cur { font-size: 20px; color: var(--muted); letter-spacing: 2px; font-weight: 600; }
    .station-switch .to {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      font-size: 15px; font-weight: 700; color: var(--accent);
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; box-shadow: var(--shadow); white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="stage">

<!-- ── Header ── -->
<div class="header">
  <div>
    <a class="station-switch" href="shin-narashino.html"><span class="cur">津田沼駅</span><span class="to"><i data-lucide="arrow-left-right"></i> 新習志野へ</span></a>
  </div>
  <div class="clock-area">
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="header-right">
    <div class="date-display" id="dateDisplay">読み込み中...</div>
    <div id="lastUpdated">-</div>
    <button class="refresh-btn" onclick="refresh()"><i data-lucide="refresh-cw"></i> 更新</button>
  </div>
</div>

<!-- ── 横画面メイン ── -->
<div class="main">
  <!-- 左：電車 -->
  <div class="main-left">
    <div class="card" id="trainCard">
      <div class="card-title"><i data-lucide="train-front"></i> 次の電車 — 参考時刻</div>
      <div class="loading">時刻を計算中...</div>
    </div>
  </div>

  <!-- 右：バス・天気 -->
  <div class="main-right">
    <!-- バス -->
    <div class="card" id="busCard">
      <div class="card-title"><i data-lucide="bus"></i> 大学バス（津田沼発 → 新習志野行）</div>
      <div class="loading">時刻を計算中...</div>
    </div>

    <!-- 天気 -->
    <div class="card" id="weatherCard">
      <div class="card-title"><i data-lucide="cloud"></i> 現在の天気 — 津田沼</div>
      <div class="loading">天気情報を取得中...</div>
    </div>

    <!-- 週間天気予報 -->
    <div class="card" id="forecastCard">
      <div class="card-title"><i data-lucide="calendar-days"></i> 週間天気予報</div>
      <div class="loading">取得中...</div>
    </div>
  </div>
</div>

</div><!-- /#stage -->

<script>
// ─────────────────────────────────────────
// 画面フィット（1920×1080キャンバスを等比スケール）
// ─────────────────────────────────────────
function fitStage() {
  const stage = document.getElementById('stage');
  if (!stage) return;
  const portrait = window.innerHeight > window.innerWidth;
  document.documentElement.classList.toggle('portrait', portrait);
  if (portrait) {
    stage.style.transform = '';
    const z = window.innerWidth / 1100;
    stage.style.zoom = z;
    stage.style.setProperty('--vh', (window.innerHeight / z) + 'px');
  } else {
    stage.style.zoom = '';
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${scale})`;
  }
}

// 時計
// ─────────────────────────────────────────
const WEEKDAYS = ['日','月','火','水','木','金','土'];

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;

  const wd = WEEKDAYS[now.getDay()];
  document.getElementById('dateDisplay').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${wd}）`;
}
setInterval(updateClock, 1000);
updateClock();

// 天気 (Open-Meteo)
// ─────────────────────────────────────────
const LAT = 35.6745, LON = 140.0183;

const WMO_MAP = {
  0: ['sun','快晴'],
  1: ['cloud-sun','おおむね晴れ'], 2: ['cloud-sun','一部曇り'], 3: ['cloud','曇り'],
  45: ['cloud-fog','霧'], 48: ['cloud-fog','霧氷'],
  51: ['cloud-drizzle','霧雨（弱）'], 53: ['cloud-drizzle','霧雨'], 55: ['cloud-rain','霧雨（強）'],
  61: ['cloud-rain','小雨'], 63: ['cloud-rain','雨'], 65: ['cloud-rain','大雨'],
  71: ['cloud-snow','小雪'], 73: ['cloud-snow','雪'], 75: ['snowflake','大雪'],
  77: ['cloud-snow','霧雪'],
  80: ['cloud-drizzle','にわか雨（弱）'], 81: ['cloud-drizzle','にわか雨'], 82: ['cloud-lightning','強いにわか雨'],
  95: ['cloud-lightning','雷雨'], 96: ['cloud-lightning','雷雨（霰）'], 99: ['cloud-lightning','激しい雷雨'],
};

function wmoInfo(code) {
  const [n, d] = WMO_MAP[code] || ['thermometer','不明'];
  return [`<i data-lucide="${n}"></i>`, d];
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + `&current=temperature_2m,relativehumidity_2m,windspeed_10m,weathercode,precipitation`
      + `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode`
      + `&forecast_days=7&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();

    const c = data.current;
    const d = data.daily;
    const [icon, desc] = wmoInfo(c.weathercode);

    // 明日の天気
    const [iconTomorrow, descTomorrow] = wmoInfo(d.weathercode[1]);
    const highTomorrow = Math.round(d.temperature_2m_max[1]);
    const lowTomorrow = Math.round(d.temperature_2m_min[1]);

    document.getElementById('weatherCard').innerHTML = `
      <div class="card-title"><i data-lucide="cloud"></i> 現在の天気 — 津田沼</div>
      <div class="weather-now">
        <div style="flex:1;display:flex;align-items:center;gap:12px">
          <div class="weather-icon">${icon}</div>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div style="width:1px;background:var(--border);align-self:stretch;margin:0 14px;flex-shrink:0"></div>
        <div style="flex:1;display:flex;align-items:center;gap:12px">
          <div class="weather-icon">${iconTomorrow}</div>
          <div>
            <div style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:2px">明日の天気</div>
            <div class="weather-temp">${highTomorrow}<span style="font-size:20px;color:var(--muted)">/${lowTomorrow}</span></div>
            <div class="weather-desc">${descTomorrow}</div>
          </div>
        </div>
      </div>
      <div class="weather-meta">
        <span><i data-lucide="droplets"></i> 湿度 ${c.relativehumidity_2m}%</span>
        <span><i data-lucide="wind"></i> 風速 ${c.windspeed_10m} m/s</span>
        <span><i data-lucide="cloud-rain"></i> 降水 ${c.precipitation} mm</span>
        <span><i data-lucide="arrow-up"></i>${Math.round(d.temperature_2m_max[0])} <i data-lucide="arrow-down"></i>${Math.round(d.temperature_2m_min[0])}</span>
      </div>
    `;

    // 週間予報（今日は上の現在天気で表示済みのため、明日以降の6日分のみ）
    const days = d.time.slice(1, 7);
    const forecastHTML = days.map((date, i) => {
      const idx = i + 1;
      const wd = WEEKDAYS[new Date(date).getDay()];
      const [fi, fd] = wmoInfo(d.weathercode[idx]);
      return `
        <div class="forecast-day">
          <div class="day-label">${i === 0 ? '明日' : wd}</div>
          <div class="day-icon" title="${fd}">${fi}</div>
          <div class="day-high">${Math.round(d.temperature_2m_max[idx])}</div>
          <div class="day-low">${Math.round(d.temperature_2m_min[idx])}</div>
        </div>`;
    }).join('');
    document.getElementById('forecastCard').innerHTML = `
      <div class="card-title"><i data-lucide="calendar-days"></i> 週間天気予報</div>
      <div class="forecast-grid">${forecastHTML}</div>
    `;
  } catch(e) {
    document.getElementById('weatherCard').innerHTML =
      `<div class="card-title"><i data-lucide="cloud"></i> 天気</div><div class="loading">取得できませんでした</div>`;
  }
}

const HOLIDAYS_2026 = new Set([
  '2026-01-01', // 元日
  '2026-01-12', // 成人の日
  '2026-02-11', // 建国記念の日
  '2026-02-23', // 天皇誕生日
  '2026-03-20', // 春分の日
  '2026-04-29', // 昭和の日
  '2026-05-03', // 憲法記念日
  '2026-05-04', // みどりの日
  '2026-05-05', // こどもの日
  '2026-05-06', // 振替休日
  '2026-07-20', // 海の日
  '2026-08-11', // 山の日

  '2026-09-22', // 国民の休日
  '2026-09-23', // 秋分の日

  '2026-11-03', // 文化の日
  '2026-11-23', // 勤労感謝の日
]);

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// 電車（JR）用の曜日種別: 土日に加え、平日の国民の祝日も「休日」扱い
function getTrainDayType(date) {
  const d = date.getDay();
  if (d === 0) return 'holiday';
  if (d === 6) return 'saturday';
  if (HOLIDAYS_2026.has(dateKey(date))) return 'holiday'; // 平日の祝日
  return 'weekday';
}

function isHoliday(date = new Date()) {
  return getTrainDayType(date) !== 'weekday';
}

// 大学バス用の曜日種別: 大学独自運行のため国民の祝日は考慮せず、曜日のみで判定
function getBusDayType(date) {
  const d = date.getDay();
  if (d === 0) return 'holiday';
  if (d === 6) return 'saturday';
  return 'weekday';
}

  const tbl = sched[line];

  const upcoming = [];
  for (let h = curH; h <= 23 && upcoming.length < n; h++) {
    const entries = tbl[h] || [];
    for (const e of entries) {
      const t = h * 60 + e.m;
      if (t > curTotal) {
        upcoming.push({ h, m: e.m, dest: e.d, s: e.s, t: e.t, diffMin: t - curTotal });
      }
      if (upcoming.length >= n) break;
    }
  }

  // 翌日補完
  if (upcoming.length < n) {
    const hours = Object.keys(tbl).map(Number).sort((a,b) => a - b);
    for (const h of hours) {
      for (const e of (tbl[h] || [])) {
        if (upcoming.length >= n) break;
        const t = (h + 24) * 60 + e.m;
        upcoming.push({ h, m: e.m, dest: e.d, s: e.s, t: e.t, diffMin: t - curTotal });
      }
      if (upcoming.length >= n) break;
    }
  }

  return upcoming;
}

// 津田沼→西船橋 乗換込み最短所要分数（約9分乗車 + 約3分乗換）
const TRANSFER_MIN = 12;

// 各総武線列車に対して乗換可能な最初の武蔵野線列車を返す
function getLinkedMusashinoTrain(sobuH, sobuM) {
  const sched = isHoliday() ? SCHED.holiday : SCHED.weekday;
  const tbl = sched['musashino'];
  // この総武線に乗った場合に西船橋で武蔵野線に乗れる最早時刻（分）
  const earliest = sobuH * 60 + sobuM + TRANSFER_MIN;

  // 全列車を絶対分で展開（翌日分も含めてラップアラウンド対応）
  const allTrains = [];
  for (const [h, entries] of Object.entries(tbl)) {
    const hi = parseInt(h);
    for (const e of entries) {
      allTrains.push({ absMin: hi * 60 + e.m, h: hi, m: e.m, dest: e.d, s: e.s });
      allTrains.push({ absMin: (hi + 24) * 60 + e.m, h: hi, m: e.m, dest: e.d, s: e.s });
    }
  }
  allTrains.sort((a, b) => a.absMin - b.absMin);

  const now = new Date();
  const nowT = now.getHours() * 60 + now.getMinutes();
  const found = allTrains.find(t => t.absMin >= earliest);
  if (!found) return null;
  return { h: found.h, m: found.m, dest: found.dest, diffMin: found.absMin - nowT, s: found.s };
}

function countdownLabel(diff) {
  if (diff <= 0)  return { label: 'まもなく', cls: 'countdown-soon' };
  if (diff < 10)  return { label: `${diff}分`, cls: 'countdown-soon' };
  if (diff < 15)  return { label: `${diff}分`, cls: 'countdown-orange' };
  if (diff < 20)  return { label: `${diff}分`, cls: 'countdown-near' };
  return          { label: `${diff}分`, cls: 'countdown-far' };
}

function destClass(d) {
  if (d === '三鷹')   return 'dest-mitaka';
  if (d === '中野')   return 'dest-nakano';
  if (d === '府中本町') return 'dest-fuchu';
  if (d === '東所沢') return 'dest-tokorozawa';
  if (d === '大宮')   return 'dest-omiya';
  if (d === '吉川美南') return 'dest-yoshikawa';
  return 'dest-fuchu';
}

// 総武快速線（東京方面）の行先クラス
function destClassKaisoku(d) {
  return d === '東京' ? 'dest-tokyo' : 'dest-yokosuka';
}

// 行き先バッジ（始発なら同じデザインの緑バッジを上に積む）
function destBadgeHTML(cls, dest, isSeat) {
  const badge = `<span class="dest-badge ${cls}">${dest}</span>`;
  if (!isSeat) return badge;
  return `<div class="badge-wrap"><span class="seat-tag">始発</span>${badge}</div>`;
}

// 日付(month*100+day)から適用ダイヤを判定（新習志野側と共通のルール）
function getBusContext(date) {
  const md = (date.getMonth() + 1) * 100 + date.getDate();
  const y = date.getFullYear();

  if (md === 723) {
    return { table: BUS_TSUDA_SCHED_COMMON_TEST, label: '前期共通試験ダイヤ（7/23）' };
  }
  if (md === 801) {
    return { unknown: true, label: '8/1は別ダイヤ運行（詳細は公式サイトをご確認ください）' };
  }
  if (md >= 808 && md <= 816) {
    return { closed: true, label: '運休期間（8/8〜8/16）' };
  }
  const isSummerMainDate =
    (md >= 724 && md <= 807) ||
    [822, 823, 824, 829, 830].includes(md) ||
    (md >= 901 && md <= 916);
  if (isSummerMainDate) {
    return { table: BUS_TSUDA_SCHED_SUMMER, label: '夏期期間中ダイヤ' };
  }
  if (md >= 817 && md <= 831) {
    const table = getBusDayType(date) === 'holiday' ? BUS_TSUDA_SCHED_INTENSIVE.sunday : BUS_TSUDA_SCHED_INTENSIVE.monToSat;
    return { table, label: '集中講義期間ダイヤ' };
  }

  // 令和8年度後期バスダイヤ（9/17〜12/22）
  if (y === 2026 && md >= 917 && md <= 1222) {
    const type = getBusDayType(date);
    const typeLabel = { weekday: '平日', saturday: '土曜', holiday: '日曜' }[type];
    return { table: BUS_TSUDA_SCHED_AUTUMN[type], label: `後期ダイヤ・${typeLabel}` };
  }
  // 12/23（水）は午後運休のため午前のみの特別ダイヤ
  if (y === 2026 && md === 1223) {
    return { table: BUS_TSUDA_SCHED_AUTUMN.dec23, label: '12/23（水）ダイヤ・午後運休' };
  }
  // 冬季運休期間（12/23午後〜1/11）
  if ((y === 2026 && md >= 1224) || (y === 2027 && md <= 111)) {
    return { closed: true, label: '冬季運休期間（12/23午後〜1/11）' };
  }

  // 2027年度ダイヤ未登録のため、1/12以降はダイヤ未更新として扱う
  const UNCOVERED_FROM = new Date(2027, 0, 12); // 2027-01-12 0:00
  if (date >= UNCOVERED_FROM) {
    return { needsUpdate: true, label: 'バスダイヤを更新してください' };
  }

  const type = getBusDayType(date);
  const typeLabel = { weekday: '平日', saturday: '土曜', holiday: '日曜' }[type];
  return { table: BUS_TSUDA_SCHED_REGULAR[type], label: `通常ダイヤ・${typeLabel}` };
}

function getNextBuses(n = 2) {
  const now = new Date();
  const curH = now.getHours();
  const curM = now.getMinutes();
  const curTotal = curH * 60 + curM;

  const ctx = getBusContext(now);
  if (ctx.closed || ctx.unknown || ctx.needsUpdate) {
    return { ctx, buses: [] };
  }

  const tbl = ctx.table;
  const upcoming = [];
  for (let h = curH; h <= 23 && upcoming.length < n; h++) {
    for (const e of (tbl[h] || [])) {
      const t = h * 60 + e.m;
      if (t > curTotal) {
        upcoming.push({ h, m: e.m, diffMin: t - curTotal });
      }
      if (upcoming.length >= n) break;
    }
  }
  return { ctx, buses: upcoming };
}

function renderBus() {
  const { ctx, buses } = getNextBuses(2);

  if (ctx.closed) {
    document.getElementById('busCard').innerHTML = `

  if (buses.length === 0) {

  const rows = buses.map(b => {

      <span class="train-time">${hh}:${mm}</span>
      <span class="train-countdown ${cls}">${label}</span>
    </div>`;
  }).join('');

  document.getElementById('busCard').innerHTML = `
    <div class="card-title"><i data-lucide="bus"></i> 大学バス（津田沼発 → 新習志野行）— ${ctx.label}</div>
    <div class="train-list">${rows}</div>
    <div class="note">${ctx.label}</div>
  `;
}

// 自動更新
// ─────────────────────────────────────────
function updateLastUpdated() {
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('lastUpdated').textContent = `更新: ${t}`;
}

// 毎分00秒のタイミングに同期して更新する
function scheduleMinuteSync() {
  const now = new Date();
  const msToNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
  setTimeout(() => {
    renderTrains();
    renderBus();
    updateLastUpdated();
    setInterval(() => {
      renderTrains();
      renderBus();
      updateLastUpdated();
    }, 60 * 1000);
  }, msToNextMinute);
}
scheduleMinuteSync();

setInterval(fetchWeather, 10 * 60 * 1000);

function refresh() {
  fetchWeather();
  renderTrains();
  renderBus();
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    `更新: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

refresh();
